<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wholesaler app prototype</title>
<style>
:root{color-scheme:light;--bg:#f6f5f1;--card:#fff;--text:#1f1e1c;--muted:#6b6a65;--line:#dcdad2;--acc:#185fa5;--accbg:#e6f1fb;--ok:#0f6e56;--okbg:#e1f5ee;--wn:#854f0b;--wnbg:#faeeda;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1b1b19;--card:#262624;--text:#f0eee8;--muted:#a3a198;--line:#3d3d3a;--acc:#85b7eb;--accbg:#0c447c;--ok:#9fe1cb;--okbg:#085041;--wn:#fac775;--wnbg:#633806}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1b1b19;--card:#262624;--text:#f0eee8;--muted:#a3a198;--line:#3d3d3a;--acc:#85b7eb;--accbg:#0c447c;--ok:#9fe1cb;--okbg:#085041;--wn:#fac775;--wnbg:#633806}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px 16px}
.main{display:flex;flex-direction:column;align-items:center;gap:12px}
.phone{position:relative;overflow:hidden;width:300px;max-width:100%;height:540px;background:var(--card);border:1.5px solid var(--line);border-radius:26px;font-size:13px}
#scr{height:calc(100% - 52px);box-sizing:border-box;padding:16px;display:flex;flex-direction:column;overflow-y:auto}
#scr h3{font-size:16px;font-weight:600;margin:2px 0 6px}#scr p{margin:0 0 8px;color:var(--muted)}
button{font:inherit;cursor:pointer}
.btn{margin-top:8px;background:var(--acc);color:var(--bg);border:0;border-radius:8px;padding:11px;font-weight:600;width:100%}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--text)}
.lnk{background:none;border:0;color:var(--acc);padding:2px 0;text-align:left}
.card.w{border:1px solid var(--line);border-radius:10px;padding:10px;margin:0 0 8px;cursor:pointer}.card small{display:block;color:var(--muted)}.stats{display:flex;gap:6px;margin:6px 0 10px}.stats div{flex:1;background:var(--bg);border-radius:10px;padding:8px}.stats small{display:block;color:var(--muted);font-size:11px}.stats b{font-size:15px;font-weight:600}
.ord{border-top:1px solid var(--line);padding:9px 0;cursor:pointer}.ord .r{display:flex;justify-content:space-between}.ord small{color:var(--muted)}
.pill{display:inline-block;border-radius:6px;padding:0 6px;font-size:11px;margin-top:3px}
.paid{background:var(--okbg);color:var(--ok)}.await{background:var(--wnbg);color:var(--wn)}.credit{background:var(--accbg);color:var(--acc)}
.box{border-radius:8px;padding:9px;margin:6px 0 8px;font-size:12px}
.chips{display:flex;gap:6px;margin:6px 0}.chips button{flex:1;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:8px;padding:8px 0}.chips button.on{border-color:var(--acc);background:var(--accbg);color:var(--acc)}
.code{font-size:26px;letter-spacing:6px;text-align:center;font-weight:600;padding:8px 0}
#nav{position:absolute;left:0;right:0;bottom:0;height:52px;display:flex;border-top:1px solid var(--line);background:var(--card)}#nav button{flex:1;border:0;background:none;color:var(--muted);font-size:12px}#nav button.on{color:var(--acc);font-weight:600}.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.row small{display:block;color:var(--muted)}.sm{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:8px;padding:4px 9px;font-size:12px}.sm.on{border-color:var(--ok);color:var(--ok)}.sm.off{border-color:var(--wn);color:var(--wn)}.step{border:1px solid var(--line);border-radius:10px;padding:10px;margin:0 0 8px}.step.done{border-color:var(--ok)}input{font:inherit;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;box-sizing:border-box;margin-bottom:8px}input:focus{outline:2px solid var(--acc)}.otp{display:flex;gap:6px;margin:6px 0 8px}.otp input{text-align:center;padding:10px 0;font-size:16px;margin:0}.err{color:#c0392b;min-height:18px;font-size:12px;margin:0 0 6px}.ic{width:84px;height:84px;border-radius:50%;background:var(--accbg);color:var(--acc);display:flex;align-items:center;justify-content:center;margin:26px auto 14px}.ob{text-align:center}.dots2{display:flex;gap:5px;justify-content:center;margin:10px 0 14px}.dots2 i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots2 i.on{background:var(--acc)}.sp{flex:1}#demo2{display:none;border:1px dashed var(--wn);color:var(--wn);background:transparent}.ctl{flex-wrap:wrap}#toast{position:absolute;top:10px;left:10px;right:10px;z-index:6;background:#2c2c2a;color:#f1efe8;border-radius:12px;padding:10px 12px;transform:translateY(-140%);transition:transform .3s}#toast.on{transform:translateY(0)}
.ctl{display:flex;gap:8px;width:300px;max-width:100%}.ctl button{flex:1;border-radius:8px;padding:9px 6px;border:1px solid var(--line);background:var(--card);color:var(--text)}
#demo{display:none;border:1px dashed var(--acc);color:var(--acc);background:transparent}
</style>
</head>
<body>
<div class="main">
<div class="phone"><div id="toast"></div><div id="scr"></div><div id="nav"></div></div>
<div class="ctl"><button id="demo"></button><button id="demo2"></button><button id="rs">Restart</button></div>
</div>
<script>
var $=function(i){return document.getElementById(i)},st,tm;

var POL=["Pay before dispatch","50% deposit","Credit for trusted"];
function reset(){st={f:"ob",ob:0,v:0,sv:0,ad:0,iv:[],rqs:[["Femi Supermart"]],eb:-1,ei:-1,mv:-1,wv:-1,aw:"",wh:["Main warehouse","Sagamu branch"],wn:"Main warehouse",wd:0,ph:"",mode:"in",biz:"Mama Sade Wholesale",addr:"8 Market Street, Ijebu Ode",typ:0,tab:"o",s:0,i:0,r:0,pol:0,setup:1,d:[0,0],sum:1,o:[{n:"Ade Provisions",a:84500,p:"paid",t:"new",d:"4.2km",it:"Indomie x5, Peak milk x2, Sugar x10",pk:"Indomie B-2207, Peak milk B-2011, Sugar B-2301"},{n:"Bola Mini Mart",a:31000,p:"await",t:"new",d:"1.8km",exp:102,it:"Water pack x6, Malt carton x3",pk:"Water B-2204, Malt B-2105"},{n:"Tunde Store",a:52000,p:"credit",t:"new",d:"5.0km",it:"Soap carton x4, Detergent x2",pk:"Soap B-2002, Detergent B-2410"}],k:[["Indomie carton",8500,1],["Peak milk tin",6000,1],["Sugar 1kg pack",3000,1],["Malt carton",9500,1],["Soap carton",11000,0]],b:[["Indomie carton","B-2207",120,"Main warehouse",240],["Peak milk tin","B-1904",24,"Main warehouse",-6],["Sugar 1kg pack","B-2301",200,"Main warehouse",300],["Water pack","B-2204",90,"Main warehouse",180],["Peak milk tin","B-2011",60,"Sagamu branch",26],["Malt carton","B-2105",40,"Sagamu branch",18],["Soap carton","B-2002",35,"Sagamu branch",400],["Detergent","B-2410",50,"Sagamu branch",500]],l:[["Kemi Stores",62000,100000,1],["Tunde Store",52000,80000,1],["Bisi Provisions",24500,60000,0],["Bola Mini Mart",0,0,0]]}}
function m(n){return "N"+n.toLocaleString("en-US")}
function toast(t){var e=$("toast");e.textContent=t;e.className="on";clearTimeout(tm);tm=setTimeout(function(){e.className=""},3200)}
var PL={paid:["paid","Paid, held"],await:["await","Awaiting payment"],credit:["credit","On your credit"]},TS={new:"New",packing:"Packing",dispatched:"On the way",delivered:"Delivered, 24h window",disputed:"Complaint open",done:"Released",cancelled:"Cancelled"};
function sum(f){return st.o.filter(f).reduce(function(a,x){return a+x.a},0)}
function chips(){return '<div class="chips" style="flex-direction:column">'+POL.map(function(x,i){return '<button data-a="pol" data-v="'+i+'" class="'+(st.pol==i?"on":"")+'">'+x+'</button>'}).join("")+'</div>'}
var OB=[["Orders without the chasing","Retailers order and pay in the app, so you stop chasing messages and money.",'<path d="M4 8l8-4 8 4v8l-8 4-8-4z" fill="none" stroke="currentColor" stroke-width="2"/>'],["Pack only paid orders","Money is held safely and released when the retailer gives the delivery code.",'<path d="M2 7h12v9H2zM14 10h5l3 3v3h-8z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="7" cy="18" r="2" fill="currentColor"/><circle cx="18" cy="18" r="2" fill="currentColor"/>'],["Never miss an order","Get a sound and a message the moment an order arrives.",'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4" fill="none" stroke="currentColor" stroke-width="2"/>']];
function pb(c,l){return '<div class="otp">'+[0,1,2,3].map(function(i){return '<input class="'+c+'" type="password" maxlength="1" inputmode="numeric" aria-label="'+l+' digit '+(i+1)+'">'}).join("")+'</div>'}
function pins(c){return Array.prototype.map.call(document.querySelectorAll("."+c),function(x){return x.value}).join("")}
function E(t){var e=$("err");if(e)e.textContent=t;return 1}
var PH='<input id="ph" type="tel" inputmode="tel" placeholder="0803 000 0000" value="\'+st.ph+\'" aria-label="Phone number">';
function pre(){var f=st.f;
if(f=="ob"){var o=OB[st.ob],last=st.ob==2;return '<div class="ob"><div class="ic"><svg width="40" height="40" viewBox="0 0 24 24">'+o[2]+'</svg></div><h3>'+o[0]+'</h3><p>'+o[1]+'</p></div><div class="dots2">'+OB.map(function(_,i){return '<i class="'+(i==st.ob?"on":"")+'"></i>'}).join("")+'</div><div class="sp"></div>'+(last?'<button class="btn" data-a="allow">Allow notifications</button><button class="btn alt" data-a="skip">Not now</button>':'<button class="btn" data-a="obn">Next</button><button class="btn alt" data-a="skip">Skip</button>')}
if(f=="in")return '<h3>Sign in</h3><p>Enter your phone number and PIN.</p><input id="ph" type="tel" inputmode="tel" placeholder="0803 000 0000" value="'+st.ph+'" aria-label="Phone number"><p style="margin:2px 0 0">PIN. Demo: any 4 digits.</p>'+pb("o","PIN")+'<div class="err" id="err"></div><button class="lnk" data-a="forgot">Forgot PIN?</button><button class="lnk" data-a="tonew">New here? Create account</button><div class="sp"></div><button class="btn" data-a="signin">Sign in</button>';
if(f=="new")return '<h3>Create account</h3><p>Use your phone number and choose a PIN.</p><input id="ph" type="tel" inputmode="tel" placeholder="0803 000 0000" value="'+st.ph+'" aria-label="Phone number"><p style="margin:2px 0 0">Choose a 4-digit PIN</p>'+pb("o","PIN")+'<p style="margin:0">Confirm PIN</p>'+pb("o2","Confirm PIN")+'<div class="err" id="err"></div><button class="lnk" data-a="toin">Already have an account? Sign in</button><div class="sp"></div><button class="btn" data-a="create">Create account</button>';
return '<h3>'+(st.mode=="new"?"Set up your business":"Confirm your business")+'</h3><p>Retailers will see this when they order.</p><input id="biz" value="'+st.biz+'" placeholder="Business name" aria-label="Business name"><input id="addr" value="'+st.addr+'" placeholder="Address" aria-label="Address"><div class="chips"><button data-a="typ" data-v="0" class="'+(st.typ?"":"on")+'">Wholesaler</button><button data-a="typ" data-v="1" class="'+(st.typ?"on":"")+'">Distributor</button></div><div class="err" id="err"></div><div class="sp"></div><button class="btn" data-a="bizgo">Save and continue</button>'}
function setup(){var n=st.d[0]+st.d[1];return '<h3>Set up in 4 steps</h3><p>About 3 minutes.</p><div class="step '+(st.wd?"done":"")+'"><b>1. Name your warehouse</b><p style="margin:2px 0 6px">Add more, like a branch, later in Settings.</p><input id="wn" value="'+st.wn+'" aria-label="Warehouse name"><button class="sm" data-a="wsave">'+(st.wd?"Saved":"Save")+'</button></div><div class="step '+(st.d[0]?"done":"")+'"><b>2. Add your price list</b><p style="margin:2px 0 6px">Take a photo of your list or upload Excel.</p><button class="sm" data-a="imp">'+(st.d[0]?"Done, 12 items read":"Take a photo")+'</button></div><div class="step done"><b>3. Choose your payment rule</b>'+chips()+'</div><div class="step '+(st.d[1]?"done":"")+'"><b>4. Your shop QR code</b><p style="margin:2px 0 0">Retailers scan it in the app to open your page.</p>'+qr()+'<button class="sm" data-a="copy">'+(st.d[1]?"Saved":"Save or print")+'</button></div><button class="btn" data-a="go">Open my dashboard</button>'}
function ts(x){return x.t=="cancelled"?(x.ex?"Expired":"Cancelled"):TS[x.t]}
function ex(n){return n>=60?Math.floor(n/60)+"h "+(n%60)+"m":n+"m"}
function vt(){return '<div class="chips"><button data-a="vw" data-v="0" class="'+(st.v?"":"on")+'">Orders</button><button data-a="vw" data-v="1" class="'+(st.v?"on":"")+'">Tracking</button></div>'}
function qr(){var g="",k=21,z=6,f=function(a,b){return a<7&&b<7};for(var r=0;r<k;r++)for(var c=0;c<k;c++){var on;if(f(r,c)||f(r,k-1-c)||f(k-1-r,c)){var a=r<7?r:k-1-r,b=c<7?c:k-1-c;on=(a==0||a==6||b==0||b==6||(a>=2&&a<=4&&b>=2&&b<=4))}else on=((r*7+c*13+r*c)%5<2);if(on)g+='<rect x="'+c*z+'" y="'+r*z+'" width="'+z+'" height="'+z+'"/>'}return '<svg viewBox="0 0 126 126" width="110" height="110" role="img" aria-label="QR code" style="background:#fff;padding:6px;border-radius:8px;display:block;margin:6px auto"><g fill="#000">'+g+'</g></svg>'}
function rec(){return st.o.filter(function(x){return x.p=="paid"&&x.t=="done"}).reduce(function(a,x){return a+x.a-(x.rf||0)},0)}
function tr(n){var L=st.l.filter(function(x){return x[0]==n})[0];return L&&L[3]}
var TD=new Date();TD=new Date(TD.getFullYear(),TD.getMonth(),TD.getDate());
function rn(i,n){n=(n||"").trim()||"Main warehouse";var o=st.wh[i];st.b.forEach(function(x){if(x[3]==o)x[3]=n});st.wh[i]=n;if(i==0)st.wn=n}
function dt(d){var x=new Date(TD.getFullYear(),TD.getMonth(),TD.getDate()+d);return x.getFullYear()+"-"+("0"+(x.getMonth()+1)).slice(-2)+"-"+("0"+x.getDate()).slice(-2)}
function board(){var G=[["Waiting for payment",function(x){return x.t=="new"&&x.p=="await"}],["To accept",function(x){return x.t=="new"&&x.p!="await"}],["Packing",function(x){return x.t=="packing"}],["On the way",function(x){return x.t=="dispatched"}],["24-hour window",function(x){return x.t=="delivered"}],["Complaints",function(x){return x.t=="disputed"}],["Released",function(x){return x.t=="done"}],["Cancelled",function(x){return x.t=="cancelled"}]],h='<h3>'+st.biz+'</h3>'+vt();G.forEach(function(g){var l=st.o.map(function(x,i){return[x,i]}).filter(function(q){return g[1](q[0])});if(!l.length)return;h+='<p style="margin:8px 0 2px"><b>'+g[0]+' ('+l.length+')</b></p>'+l.map(function(q){var x=q[0],d=x.t=="dispatched"?'<small>'+(st.r?"Kola":"Tunde")+' left at '+x.left+', due by '+x.eta+'</small> '+(x.late?'<span class="pill await">Late by 25 min</span>':'<span class="pill paid">On time</span>'):x.t=="new"&&x.p=="await"?'<small>Expires in '+ex(x.exp)+'</small>':x.t=="delivered"?'<small>Money releases in 24h unless a complaint is sent</small>':x.t=="disputed"?'<small>'+x.rs+'</small>':'<small>'+ts(x)+'</small>';return '<div class="ord" data-a="open" data-i="'+q[1]+'"><div class="r"><b>'+x.n+'</b><span>'+m(x.a)+'</span></div>'+d+'</div>'}).join("")});return h}
function orders(){var o=st.o[st.i];
if(st.s==0&&st.v)return board();
if(st.s==0)return '<h3>'+st.biz+'</h3><p style="margin:0 0 4px">Rule: '+POL[st.pol]+'</p>'+vt()+'<div class="stats"><div><small>To pack</small><b>'+st.o.filter(function(x){return x.p!="await"&&(x.t=="new"||x.t=="packing")}).length+'</b></div><div><small>Held</small><b>'+m(sum(function(x){return x.p=="paid"&&x.t!="done"&&x.t!="cancelled"}))+'</b></div><div><small>Released</small><b>'+m(rec())+'</b></div></div>'+st.o.map(function(x,i){return '<div class="ord" data-a="open" data-i="'+i+'"><div class="r"><b>'+x.n+'</b><span>'+m(x.a)+'</span></div><span class="pill '+PL[x.p][0]+'">'+PL[x.p][1]+'</span> <small>'+ts(x)+'</small>'+(x.p=="await"&&x.t=="new"?' <small>Expires in '+ex(x.exp)+'</small>':'')+'</div>'}).join("");
var b='<button class="lnk" data-a="home">&lsaquo; All orders</button><h3>'+o.n+'</h3><p>'+o.d+' away. '+o.it+'</p>';
if(st.s==1){var t=o.t;
b+=t=="cancelled"?'<div class="box await">'+ts(o)+'.</div>':o.p=="paid"?'<div class="box paid">'+(t=="done"?'Released to you: '+m(o.a-(o.rf||0))+(o.rf?' (refunded '+m(o.rf)+').':'.'):t=="delivered"?'Paid '+m(o.a)+'. Delivered. Held for 24 hours in case of a complaint, then released.':t=="disputed"?'Paid '+m(o.a)+'. On hold while the complaint is open.':'Paid '+m(o.a)+'. Held safely. Released 24 hours after delivery.')+'</div>':o.p=="await"?'<div class="box await">Not paid yet. Do not pack until payment arrives. '+(tr(o.n)?'':'Not on your trusted list, so no credit. ')+'It expires in '+ex(o.exp)+', with reminders to the retailer at 30 and 10 minutes.</div>':'<div class="box credit">On your credit. Added to what they owe you.</div>';
if((t=="new"||t=="packing")&&o.p!="await")b+='<div class="box credit">Pack from the oldest valid batch: '+o.pk+'. Expired batches are blocked.</div>';
if(t=="cancelled"||t=="done"){}else if(o.p=="await")b+='<button class="btn alt" data-a="remind">Send payment reminder</button>'+(tr(o.n)?'':'<button class="btn alt" data-a="trust">Mark '+o.n+' as trusted</button>');
else if(t=="new")b+='<button class="btn" data-a="accept">Accept and send packing list</button><button class="btn alt" data-a="swap">Item short? Offer a swap</button>';
else if(t=="packing")b+='<button class="btn" data-a="todisp">Assign rider and dispatch</button>';
else if(t=="dispatched")b+='<div class="box '+(o.late?"await":"credit")+'">On the way with '+(st.r?"Kola":"Tunde")+'. Left at '+o.left+', due by '+o.eta+'.'+(o.late?' Running late.':'')+' The retailer gives the delivery code at the door.</div><button class="btn alt" data-a="call">Call rider</button>';
else if(t=="delivered")b+='<div class="box credit">Delivered with code 4821. The retailer can report a problem for 24 hours. Then the money is released.</div>';
else if(t=="disputed")b+='<div class="box await">Complaint: '+o.rs+'. Photo attached. Money stays held until you settle.</div><button class="btn" data-a="refund">Refund 10% and release the rest</button><button class="btn alt" data-a="replace">Offer a replacement</button>';
if(t=="new"||t=="packing"||t=="dispatched")b+='<button class="btn alt" data-a="cancel">Cancel order</button>';return b}
return b+'<p style="margin:6px 0 0">Rider</p><div class="chips"><button data-a="rider" data-v="0" class="'+(st.r?"":"on")+'">Tunde, bike</button><button data-a="rider" data-v="1" class="'+(st.r?"on":"")+'">Kola, bike</button></div><p style="margin:6px 0 0">Delivery code for this order</p><div class="code">4821</div><p>The retailer gives this to the rider at the door.</p><button class="btn" data-a="dispatch">Mark dispatched</button>'}
function addf(){return '<button class="lnk" data-a="addx">&lsaquo; Back</button><h3>Add an item</h3><input id="an" placeholder="Item name" aria-label="Item name"><input id="ap" type="number" placeholder="Price (N)" aria-label="Price"><input id="aq" type="number" placeholder="Quantity" aria-label="Quantity"><input id="ab" placeholder="Batch number, for example B-2412" aria-label="Batch number"><p style="margin:0 0 2px">Expiry date</p><input id="ae" type="date" aria-label="Expiry date"><select id="aw" aria-label="Warehouse" style="font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);margin-bottom:8px">'+st.wh.map(function(w){return '<option'+(w==st.aw?' selected':'')+'>'+w+'</option>'}).join("")+'</select><div class="err" id="err"></div><button class="btn" data-a="addsave">Save item</button>'}
function mg(a){var o=[];a.forEach(function(x){var f=o.filter(function(y){return y[0]==x[0]&&y[1]==x[1]&&y[3]==x[3]})[0];if(f)f[2]+=x[2];else o.push(x)});return o}
